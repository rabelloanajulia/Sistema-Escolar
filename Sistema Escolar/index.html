<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema Escolar | Entrar</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="login-container">
    <section class="login-card">
      <h1>Sistema Escolar</h1>
      <p class="subtitle">Entre com seus dados de acesso</p>

      <form id="loginForm">
        <label for="email">E-mail</label>
        <input id="email" type="email" autocomplete="username"
               placeholder="seuemail@exemplo.com" required>

        <label for="senha">Senha</label>
        <input id="senha" type="password" autocomplete="current-password"
               placeholder="Sua senha" required>

        <button id="entrarBtn" type="submit">Entrar</button>
        <p id="mensagem" class="message" role="status"></p>
      </form>
    </section>
  </main>

  <script type="module" src="js/login.js"></script>
</body>
</html>
